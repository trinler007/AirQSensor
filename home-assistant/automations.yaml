# Beispiel: Entitäts- und Notify-Namen nach dem Einbinden der Geräte anpassen.
- alias: "AirQ CO Diagnosealarm"
  id: airq_co_diagnosealarm
  mode: parallel
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.airq_wohnbereich_co_diagnosealarm
        - binary_sensor.airq_fahrerhaus_co_diagnosealarm
      to: "on"
      for: "00:00:05"
  actions:
    - action: notify.mobile_app_MEIN_TELEFON
      data:
        title: "CO-Diagnosealarm im Wohnmobil"
        message: >-
          {{ trigger.to_state.attributes.friendly_name }} meldet einen erhöhten CO-Wert.
          Sofort lüften, Heizungen/Verbrenner abschalten und einen sicheren Ort aufsuchen.
          Nicht auf dieses nicht zertifizierte System als Personenschutz verlassen.

- alias: "AirQ mögliche Abgase"
  id: airq_moegliche_abgase
  mode: parallel
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.airq_wohnbereich_mogliche_abgase
        - binary_sensor.airq_fahrerhaus_mogliche_abgase
      to: "on"
      for: "00:00:30"
  actions:
    - action: notify.mobile_app_MEIN_TELEFON
      data:
        title: "AirQ: mögliche Abgase"
        message: "CO, VOC und NOx steigen gleichzeitig. Innenraum lüften und Verbrennungsquellen prüfen."

- alias: "AirQ Sensordaten fehlen"
  id: airq_sensordaten_fehlen
  mode: parallel
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.airq_wohnbereich_messdaten_aktuell
        - binary_sensor.airq_fahrerhaus_messdaten_aktuell
      to: "off"
      for: "00:05:00"
  actions:
    - action: notify.mobile_app_MEIN_TELEFON
      data:
        title: "AirQ: Sensor prüfen"
        message: >-
          {{ trigger.to_state.attributes.friendly_name }} ist seit fünf Minuten nicht aktuell.
          Stromversorgung, Verkabelung und den Textsensor „Sensorzustand“ prüfen.

- alias: "AirQ Kondensationsrisiko"
  id: airq_kondensationsrisiko
  mode: parallel
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.airq_wohnbereich_kondensationsrisiko
        - binary_sensor.airq_fahrerhaus_kondensationsrisiko
      to: "on"
      for: "00:15:00"
  actions:
    - action: notify.mobile_app_MEIN_TELEFON
      data:
        title: "AirQ: Kondensationsrisiko"
        message: >-
          {{ trigger.to_state.attributes.friendly_name }} ist seit 15 Minuten aktiv.
          Feuchte reduzieren, lüften und bekannte Kältebrücken kontrollieren.

- alias: "AirQ ZE07 Wartung fällig"
  id: airq_ze07_wartung_faellig
  mode: parallel
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.airq_wohnbereich_ze07_wartung_fallig
        - binary_sensor.airq_fahrerhaus_ze07_wartung_fallig
      to: "on"
  actions:
    - action: persistent_notification.create
      data:
        title: "AirQ: ZE07 prüfen"
        message: >-
          {{ trigger.to_state.attributes.friendly_name }} hat das konfigurierte
          Wartungsintervall erreicht. Sensoralter, Funktion und Austausch prüfen.
