substitutions:
  device_name: airq-fahrerhaus
  friendly_name: "AirQ Fahrerhaus"
  device_location: "Fahrerhaus nahe Eberspächer-Heizung"
  assessment_location: "im Fahrerhaus"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: LIGHT
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_ap_password_fahrerhaus

api:
  encryption:
    key: !secret api_encryption_key_fahrerhaus

ota:
  - platform: esphome
    password: !secret ota_password_fahrerhaus

external_components:
  - source:
      type: git
      url: https://github.com/trinler007/AirQSensor
      ref: main
      username: !secret github_username
      password: !secret github_password
    components: [ze07_co]
    refresh: 1h

packages:
  air_quality:
    url: https://github.com/trinler007/AirQSensor
    username: !secret github_username
    password: !secret github_password
    ref: main
    files:
      - common/air-quality.yaml
    refresh: 1h
