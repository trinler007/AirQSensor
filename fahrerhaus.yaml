substitutions:
  device_name: airq-fahrerhaus
  friendly_name: "AirQ Fahrerhaus"
  device_location: "Fahrerhaus nahe Eberspächer-Heizung"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: LIGHT
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_ap_password_fahrerhaus

api:
  encryption:
    key: !secret api_encryption_key_fahrerhaus

ota:
  - platform: esphome
    password: !secret ota_password_fahrerhaus

packages:
  air_quality: !include common/air-quality.yaml
