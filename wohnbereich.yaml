substitutions:
  device_name: airq-wohnbereich
  friendly_name: "AirQ Wohnbereich"
  device_location: "Wohnbereich nahe Truma D6E"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: LIGHT
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_ap_password_wohnbereich

api:
  encryption:
    key: !secret api_encryption_key_wohnbereich

ota:
  - platform: esphome
    password: !secret ota_password_wohnbereich

packages:
  air_quality: !include common/air-quality.yaml
