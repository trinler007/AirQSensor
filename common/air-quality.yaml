substitutions:
  # Diagnose-Startwerte, keine normativen oder zertifizierten Alarmgrenzen.
  # Die lokale Geraete-YAML kann dies z. B. mit "im Wohnbereich" ueberschreiben.
  assessment_location: "am Messort"
  co_alarm_default: "30.0"
  co_elevated_default: "5.0"
  co2_ventilation_default: "1000.0"
  co2_critical_default: "2000.0"
  voc_elevated_default: "150.0"
  voc_high_default: "250.0"
  nox_elevated_default: "2.0"
  nox_high_default: "10.0"
  temperature_min_default: "20.0"
  temperature_max_default: "24.0"
  humidity_min_default: "40.0"
  humidity_max_default: "60.0"
  co_rise_default: "2.0"
  voc_rise_default: "5.0"
  nox_rise_default: "2.0"
  cold_bridge_offset_default: "5.0"
  condensation_warning_default: "3.0"
  sensor_stale_default: "120.0"
  ze07_service_hours_default: "26280.0"
  scd41_calibration_reference_default: "426.0"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: ${device_location}
  min_version: 2026.7.0
  project:
    name: trinler.airq_sensor
    version: "0.2.0"

logger:
  # Alle Stufen werden einkompiliert, der sichere Startwert bleibt DEBUG.
  # VERBOSE und VERY_VERBOSE nur kurzzeitig zur Diagnose verwenden.
  level: VERY_VERBOSE
  initial_level: DEBUG
  # Das ESP32-S3-DevKitC-1 fuehrt UART0 auf GPIO43/44 zur USB-UART-Bridge.
  # Der ZE07 nutzt separat UART1 mit RX auf GPIO18; es besteht kein Konflikt.
  hardware_uart: UART0

captive_portal:

i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true
  frequency: 100kHz

uart:
  id: ze07_uart
  # Nativer U1RXD-Pin des ESP32-S3. Der ZE07 sendet im aktiven Modus
  # selbstständig; eine TX-Leitung ist dafür weder nötig noch angeschlossen.
  rx_pin: GPIO18
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 256

debug:
  update_interval: 60s

globals:
  - id: last_scd41_update_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: last_sgp41_update_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: last_ze07_update_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: ze07_operating_hours_total
    type: float
    restore_value: true
    initial_value: "0.0"

# Persistente Diagnosegrenzen. Aenderungen in Home Assistant bleiben nach
# einem Neustart erhalten. Es handelt sich nicht um zertifizierte Alarmwerte.
number:
  - platform: template
    name: "Grenzwert CO erhöht"
    id: co_elevated_limit
    unit_of_measurement: "ppm"
    icon: mdi:molecule-co
    entity_category: config
    min_value: 1
    max_value: 50
    step: 1
    initial_value: ${co_elevated_default}
    optimistic: true
    restore_value: true
    mode: box

  - platform: template
    name: "Grenzwert CO Diagnosealarm"
    id: co_alarm_limit
    unit_of_measurement: "ppm"
    icon: mdi:molecule-co
    entity_category: config
    min_value: 5
    max_value: 200
    step: 1
    initial_value: ${co_alarm_default}
    optimistic: true
    restore_value: true
    mode: box

  - platform: template
    name: "Grenzwert CO2 lüften"
    id: co2_ventilation_limit
    unit_of_measurement: "ppm"
    icon: mdi:molecule-co2
    entity_category: config
    min_value: 600
    max_value: 2500
    step: 50
    initial_value: ${co2_ventilation_default}
    optimistic: true
    restore_value: true
    mode: box

  - platform: template
    name: "Grenzwert CO2 kritisch"
    id: co2_critical_limit
    unit_of_measurement: "ppm"
    icon: mdi:molecule-co2
    entity_category: config
    min_value: 1000
    max_value: 5000
    step: 100
    initial_value: ${co2_critical_default}
    optimistic: true
    restore_value: true
    mode: box

  - platform: template
    name: "Grenzwert VOC erhöht"
    id: voc_elevated_limit
    icon: mdi:air-filter
    entity_category: config
    min_value: 100
    max_value: 400
    step: 5
    initial_value: ${voc_elevated_default}
    optimistic: true
    restore_value: true
    mode: box

  - platform: template
    name: "Grenzwert VOC hoch"
    id: voc_high_limit
    icon: mdi:air-filter
    entity_category: config
    min_value: 150
    max_value: 500
    step: 5
    initial_value: ${voc_high_default}
    optimistic: true
    restore_value: true
    mode: box

  - platform: template
    name: "Grenzwert NOx erhöht"
    id: nox_elevated_limit
    icon: mdi:air-filter
    entity_category: config
    min_value: 2
    max_value: 200
    step: 1
    initial_value: ${nox_elevated_default}
    optimistic: true
    restore_value: true
    mode: box

  - platform: template
    name: "Grenzwert NOx hoch"
    id: nox_high_limit
    icon: mdi:air-filter
    entity_category: config
    min_value: 5
    max_value: 500
    step: 1
    initial_value: ${nox_high_default}
    optimistic: true
    restore_value: true
    mode: box

  - platform: template
    name: "Empfohlene Temperatur Minimum"
    id: temperature_min_limit
    unit_of_measurement: "°C"
    device_class: temperature
    entity_category: config
    min_value: 10
    max_value: 25
    step: 0.5
    initial_value: ${temperature_min_default}
    optimistic: true
    restore_value: true
    mode: box

  - platform: template
    name: "Empfohlene Temperatur Maximum"
    id: temperature_max_limit
    unit_of_measurement: "°C"
    device_class: temperature
    entity_category: config
    min_value: 18
    max_value: 35
    step: 0.5
    initial_value: ${temperature_max_default}
    optimistic: true
    restore_value: true
    mode: box

  - platform: template
    name: "Empfohlene Luftfeuchte Minimum"
    id: humidity_min_limit
    unit_of_measurement: "%"
    device_class: humidity
    entity_category: config
    min_value: 20
    max_value: 60
    step: 1
    initial_value: ${humidity_min_default}
    optimistic: true
    restore_value: true
    mode: box

  - platform: template
    name: "Empfohlene Luftfeuchte Maximum"
    id: humidity_max_limit
    unit_of_measurement: "%"
    device_class: humidity
    entity_category: config
    min_value: 40
    max_value: 90
    step: 1
    initial_value: ${humidity_max_default}
    optimistic: true
    restore_value: true
    mode: box

  - platform: template
    name: "Grenzwert CO Anstieg"
    id: co_rise_limit
    unit_of_measurement: "ppm/min"
    entity_category: config
    min_value: 0.5
    max_value: 20
    step: 0.5
    initial_value: ${co_rise_default}
    optimistic: true
    restore_value: true
    mode: box

  - platform: template
    name: "Grenzwert VOC Anstieg"
    id: voc_rise_limit
    unit_of_measurement: "index/min"
    entity_category: config
    min_value: 1
    max_value: 100
    step: 1
    initial_value: ${voc_rise_default}
    optimistic: true
    restore_value: true
    mode: box

  - platform: template
    name: "Grenzwert NOx Anstieg"
    id: nox_rise_limit
    unit_of_measurement: "index/min"
    entity_category: config
    min_value: 1
    max_value: 100
    step: 1
    initial_value: ${nox_rise_default}
    optimistic: true
    restore_value: true
    mode: box

  - platform: template
    name: "Kältebrücke Temperaturdifferenz"
    id: cold_bridge_offset_limit
    unit_of_measurement: "°C"
    device_class: temperature
    entity_category: config
    min_value: 0
    max_value: 20
    step: 0.5
    initial_value: ${cold_bridge_offset_default}
    optimistic: true
    restore_value: true
    mode: box

  - platform: template
    name: "Kondensationsreserve Warnung"
    id: condensation_warning_limit
    unit_of_measurement: "°C"
    device_class: temperature
    entity_category: config
    min_value: 0.5
    max_value: 10
    step: 0.5
    initial_value: ${condensation_warning_default}
    optimistic: true
    restore_value: true
    mode: box

  - platform: template
    name: "Messdaten veraltet nach"
    id: sensor_stale_limit
    unit_of_measurement: "s"
    device_class: duration
    entity_category: config
    min_value: 60
    max_value: 600
    step: 30
    initial_value: ${sensor_stale_default}
    optimistic: true
    restore_value: true
    mode: box

  - platform: template
    name: "ZE07 Wartungsintervall"
    id: ze07_service_hours_limit
    unit_of_measurement: "h"
    device_class: duration
    entity_category: config
    min_value: 8760
    max_value: 43800
    step: 720
    initial_value: ${ze07_service_hours_default}
    optimistic: true
    restore_value: true
    mode: box

  - platform: template
    name: "SCD41 Kalibrierreferenz"
    id: scd41_calibration_reference
    unit_of_measurement: "ppm"
    device_class: carbon_dioxide
    entity_category: config
    min_value: 400
    max_value: 1000
    step: 1
    initial_value: ${scd41_calibration_reference_default}
    optimistic: true
    restore_value: true
    mode: box

select:
  - platform: logger
    name: "Logger Level"
    icon: mdi:math-log
    entity_category: config

sensor:
  - platform: scd4x
    id: scd41_component
    address: 0x62
    measurement_mode: low_power_periodic
    update_interval: 30s
    automatic_self_calibration: true
    co2:
      name: "CO₂"
      id: co2
      accuracy_decimals: 0
      on_value:
        then:
          - lambda: id(last_scd41_update_ms) = millis();
    temperature:
      name: "Temperatur"
      id: temperature
      accuracy_decimals: 1
    humidity:
      name: "Luftfeuchte"
      id: humidity
      accuracy_decimals: 1

  - platform: sgp4x
    id: sgp41_component
    address: 0x59
    update_interval: 30s
    store_baseline: true
    voc:
      name: "VOC Index"
      id: voc_index
      accuracy_decimals: 0
      on_value:
        then:
          - lambda: id(last_sgp41_update_ms) = millis();
    nox:
      name: "NOx Index"
      id: nox_index
      accuracy_decimals: 0
    compensation:
      temperature_source: temperature
      humidity_source: humidity

  - platform: ze07_co
    id: ze07_component
    uart_id: ze07_uart
    co:
      name: "CO"
      id: co
      filters:
        - throttle_average: 10s
      on_value:
        then:
          - lambda: id(last_ze07_update_ms) = millis();
    full_scale:
      name: "CO Messbereich"
      entity_category: diagnostic
    frame_errors:
      name: "CO UART Framefehler"
      entity_category: diagnostic

  - platform: wifi_signal
    name: "WLAN Signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    entity_category: diagnostic

  - platform: debug
    free:
      name: "Freier Heap"
      entity_category: diagnostic
    min_free:
      name: "Minimaler freier Heap"
      entity_category: diagnostic
    loop_time:
      name: "Maximale Loop-Zeit"
      entity_category: diagnostic

  - platform: template
    name: "Taupunkt"
    id: dew_point
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 30s
    lambda: |-
      const float t = id(temperature).state;
      const float rh = id(humidity).state;
      if (isnan(t) || isnan(rh) || rh <= 0.0f || rh > 100.0f) return {};
      const float gamma = logf(rh / 100.0f) + (17.62f * t) / (243.12f + t);
      return (243.12f * gamma) / (17.62f - gamma);

  - platform: template
    name: "Absolute Luftfeuchte"
    id: absolute_humidity
    unit_of_measurement: "g/m³"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 30s
    lambda: |-
      const float t = id(temperature).state;
      const float rh = id(humidity).state;
      if (isnan(t) || isnan(rh) || rh < 0.0f || rh > 100.0f) return {};
      const float saturation = 6.112f * expf((17.62f * t) / (243.12f + t));
      return 216.7f * (saturation * rh / 100.0f) / (273.15f + t);

  - platform: template
    name: "Geschätzte Kältebrückentemperatur"
    id: estimated_cold_bridge_temperature
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 30s
    lambda: |-
      if (isnan(id(temperature).state)) return {};
      return id(temperature).state - id(cold_bridge_offset_limit).state;

  - platform: template
    name: "Geschätzte Kondensationsreserve"
    id: condensation_margin
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 30s
    lambda: |-
      if (isnan(id(estimated_cold_bridge_temperature).state) ||
          isnan(id(dew_point).state)) return {};
      return id(estimated_cold_bridge_temperature).state - id(dew_point).state;

  - platform: template
    name: "Alter SCD41 Messdaten"
    id: scd41_data_age
    unit_of_measurement: "s"
    device_class: duration
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      if (id(last_scd41_update_ms) == 0) return {};
      return (uint32_t) (millis() - id(last_scd41_update_ms)) / 1000.0f;

  - platform: template
    name: "Alter SGP41 Messdaten"
    id: sgp41_data_age
    unit_of_measurement: "s"
    device_class: duration
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      if (id(last_sgp41_update_ms) == 0) return {};
      return (uint32_t) (millis() - id(last_sgp41_update_ms)) / 1000.0f;

  - platform: template
    name: "Alter ZE07 Messdaten"
    id: ze07_data_age
    unit_of_measurement: "s"
    device_class: duration
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      if (id(last_ze07_update_ms) == 0) return {};
      return (uint32_t) (millis() - id(last_ze07_update_ms)) / 1000.0f;

  - platform: template
    name: "ZE07 Betriebsstunden"
    id: ze07_operating_hours
    unit_of_measurement: "h"
    device_class: duration
    state_class: total_increasing
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 60s
    lambda: return id(ze07_operating_hours_total);

  # Ein-Minuten-Differenzen als leicht verständliche Trendindikatoren.
  - platform: template
    name: "CO Trend"
    id: co_trend
    unit_of_measurement: "ppm/min"
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      static float previous = NAN;
      const float current = id(co).state;
      if (isnan(current)) return {};
      if (isnan(previous)) { previous = current; return 0.0f; }
      const float delta = current - previous;
      previous = current;
      return delta;

  - platform: template
    name: "VOC Trend"
    id: voc_trend
    unit_of_measurement: "index/min"
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      static float previous = NAN;
      const float current = id(voc_index).state;
      if (isnan(current)) return {};
      if (isnan(previous)) { previous = current; return 0.0f; }
      const float delta = current - previous;
      previous = current;
      return delta;

  - platform: template
    name: "NOx Trend"
    id: nox_trend
    unit_of_measurement: "index/min"
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      static float previous = NAN;
      const float current = id(nox_index).state;
      if (isnan(current)) return {};
      if (isnan(previous)) { previous = current; return 0.0f; }
      const float delta = current - previous;
      previous = current;
      return delta;

binary_sensor:
  - platform: status
    name: "Status"
    entity_category: diagnostic

  - platform: ze07_co
    ze07_co_id: ze07_component
    connected:
      name: "CO Sensor verbunden"
      id: ze07_connected
      entity_category: diagnostic

  - platform: template
    name: "Messdaten aktuell"
    id: sensor_data_healthy
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      if (isnan(id(scd41_data_age).state) || isnan(id(sgp41_data_age).state) ||
          isnan(id(ze07_data_age).state)) return {};
      return id(scd41_data_age).state <= id(sensor_stale_limit).state &&
             id(sgp41_data_age).state <= id(sensor_stale_limit).state &&
             id(ze07_data_age).state <= id(sensor_stale_limit).state &&
             id(ze07_connected).state;
    filters:
      - delayed_on: 10s
      - delayed_off: 10s

  - platform: template
    name: "Kondensationsrisiko"
    id: condensation_risk
    device_class: problem
    lambda: |-
      if (isnan(id(condensation_margin).state)) return {};
      return id(condensation_margin).state <= id(condensation_warning_limit).state;
    filters:
      - delayed_on: 2min
      - delayed_off: 5min

  - platform: template
    name: "ZE07 Wartung fällig"
    id: ze07_service_due
    device_class: problem
    entity_category: diagnostic
    lambda: return id(ze07_operating_hours_total) >= id(ze07_service_hours_limit).state;

  - platform: template
    name: "Lüften empfohlen"
    id: ventilation_recommended
    device_class: problem
    lambda: |-
      if (isnan(id(co2).state) || isnan(id(voc_index).state) ||
          isnan(id(nox_index).state) || isnan(id(co).state)) return {};
      return (id(co2).state >= id(co2_ventilation_limit).state ||
              id(voc_index).state >= id(voc_elevated_limit).state ||
              id(nox_index).state >= id(nox_elevated_limit).state) &&
             id(co).state < id(co_elevated_limit).state;
    filters:
      - delayed_on: 2min
      - delayed_off: 2min

  - platform: template
    name: "Heizung oder Verbrennung auffällig"
    id: combustion_suspicious
    device_class: problem
    lambda: |-
      if (isnan(id(co_trend).state) || isnan(id(voc_trend).state) || isnan(id(co2).state)) return {};
      return id(co_trend).state >= id(co_rise_limit).state &&
             id(voc_trend).state >= id(voc_rise_limit).state &&
             id(co2).state < id(co2_ventilation_limit).state;
    filters:
      - delayed_on: 30s
      - delayed_off: 2min

  - platform: template
    name: "Mögliche Abgase"
    id: possible_exhaust
    device_class: problem
    lambda: |-
      if (isnan(id(co).state) || isnan(id(co_trend).state) ||
          isnan(id(voc_trend).state) || isnan(id(nox_trend).state)) return {};
      return id(co).state >= id(co_elevated_limit).state &&
             id(co_trend).state >= id(co_rise_limit).state &&
             id(voc_trend).state >= id(voc_rise_limit).state &&
             id(nox_trend).state >= id(nox_rise_limit).state;
    filters:
      - delayed_on: 30s
      - delayed_off: 2min

  - platform: template
    name: "CO Diagnosealarm"
    id: co_diagnostic_alarm
    device_class: carbon_monoxide
    lambda: |-
      if (isnan(id(co).state)) return {};
      return id(co).state >= id(co_alarm_limit).state;
    filters:
      - delayed_on: 10s
      - delayed_off: 2min

text_sensor:
  - platform: template
    name: "Luftqualität Bewertung"
    icon: mdi:air-filter
    update_interval: 30s
    lambda: |-
      if (isnan(id(co).state) || isnan(id(co2).state) ||
          isnan(id(voc_index).state) || isnan(id(nox_index).state) ||
          isnan(id(temperature).state) || isnan(id(humidity).state))
        return {"Die Luftqualität ${assessment_location} wird noch ermittelt. Es fehlen gültige Messwerte."};
      if ((!isnan(id(scd41_data_age).state) && id(scd41_data_age).state > id(sensor_stale_limit).state) ||
          (!isnan(id(sgp41_data_age).state) && id(sgp41_data_age).state > id(sensor_stale_limit).state) ||
          (!isnan(id(ze07_data_age).state) && id(ze07_data_age).state > id(sensor_stale_limit).state) ||
          !id(ze07_connected).state)
        return {"Die Luftqualität ${assessment_location} kann nicht zuverlässig bewertet werden. Sensordaten fehlen oder sind veraltet."};

      const float co_value = id(co).state;
      const float co2_value = id(co2).state;
      const float voc_value = id(voc_index).state;
      const float nox_value = id(nox_index).state;
      const float temperature_value = id(temperature).state;
      const float humidity_value = id(humidity).state;

      const char *co_text = "unauffällig";
      const char *co2_text = "gut";
      const char *voc_text = "normal";
      const char *nox_text = "normal";
      const char *temperature_text = "angenehm";
      const char *humidity_text = "optimal";
      const char *recommendation = "keine Maßnahme nötig";
      int severity = 0;

      if (co_value >= id(co_alarm_limit).state) {
        co_text = "Alarm";
        severity = 4;
      } else if (co_value >= id(co_elevated_limit).state) {
        co_text = "erhöht";
        severity = 3;
      }

      if (co2_value >= id(co2_critical_limit).state) {
        co2_text = "sehr hoch";
        if (severity < 3) severity = 3;
      } else if (co2_value >= id(co2_ventilation_limit).state) {
        co2_text = "erhöht";
        if (severity < 2) severity = 2;
      }

      if (voc_value >= id(voc_high_limit).state) {
        voc_text = "hoch";
        if (severity < 3) severity = 3;
      } else if (voc_value >= id(voc_elevated_limit).state) {
        voc_text = "erhöht";
        if (severity < 2) severity = 2;
      }

      if (nox_value >= id(nox_high_limit).state) {
        nox_text = "hoch";
        if (severity < 3) severity = 3;
      } else if (nox_value >= id(nox_elevated_limit).state) {
        nox_text = "erhöht";
        if (severity < 2) severity = 2;
      }

      if (temperature_value < id(temperature_min_limit).state) {
        temperature_text = "zu kalt";
        if (severity < 1) severity = 1;
      } else if (temperature_value > id(temperature_max_limit).state) {
        temperature_text = "zu warm";
        if (severity < 1) severity = 1;
      }

      if (humidity_value < id(humidity_min_limit).state) {
        humidity_text = "zu trocken";
        if (severity < 1) severity = 1;
      } else if (humidity_value > id(humidity_max_limit).state) {
        humidity_text = "zu hoch";
        if (severity < 1) severity = 1;
      }

      if (!isnan(id(condensation_margin).state)) {
        if (id(condensation_margin).state <= 0.0f) {
          if (severity < 3) severity = 3;
        } else if (id(condensation_margin).state <= id(condensation_warning_limit).state) {
          if (severity < 2) severity = 2;
        }
      }

      if (co_value >= id(co_alarm_limit).state) {
        recommendation = "sofort lüften, Heizungen aus und Ursache prüfen";
        severity = 4;
      } else if (id(possible_exhaust).state) {
        recommendation = "lüften und Heizungen sowie Abgasführung prüfen";
        severity = 4;
      } else if (id(combustion_suspicious).state) {
        recommendation = "lüften und Verbrennung der Heizung prüfen";
        if (severity < 3) severity = 3;
      } else if (co_value >= id(co_elevated_limit).state) {
        recommendation = "lüften und mögliche CO-Quelle prüfen";
      } else if (co2_value >= id(co2_ventilation_limit).state ||
                 voc_value >= id(voc_elevated_limit).state ||
                 nox_value >= id(nox_elevated_limit).state) {
        recommendation = "jetzt lüften";
      } else if (!isnan(id(condensation_margin).state) &&
                 id(condensation_margin).state <= id(condensation_warning_limit).state) {
        recommendation = "Kältebrücken prüfen und Feuchte reduzieren";
      } else if (temperature_value < id(temperature_min_limit).state ||
                 temperature_value > id(temperature_max_limit).state ||
                 humidity_value < id(humidity_min_limit).state ||
                 humidity_value > id(humidity_max_limit).state) {
        recommendation = "Heizung oder Lüftung anpassen";
      }

      const char *overall_text = "gut";
      if (severity == 1) overall_text = "mäßig";
      else if (severity == 2) overall_text = "auffällig";
      else if (severity == 3) overall_text = "schlecht";
      else if (severity >= 4) overall_text = "kritisch";

      return {str_sprintf(
        "Die Luftqualität ${assessment_location} ist %s. CO2 %.0f ppm, %s; CO %.1f ppm, %s; VOC %.0f, %s; "
        "NOx %.0f, %s; Temperatur %.1f Grad, %s; Feuchte %.0f Prozent, %s. "
        "Empfehlung: %s.",
        overall_text, co2_value, co2_text, co_value, co_text, voc_value, voc_text,
        nox_value, nox_text, temperature_value, temperature_text, humidity_value,
        humidity_text, recommendation)};

  - platform: template
    name: "Luftqualität Kurzbewertung"
    icon: mdi:account-voice
    update_interval: 30s
    lambda: |-
      if (isnan(id(co).state) || isnan(id(co2).state) ||
          isnan(id(voc_index).state) || isnan(id(nox_index).state) ||
          isnan(id(temperature).state) || isnan(id(humidity).state))
        return {"Die Luftqualität ${assessment_location} wird noch ermittelt."};
      if ((!isnan(id(scd41_data_age).state) && id(scd41_data_age).state > id(sensor_stale_limit).state) ||
          (!isnan(id(sgp41_data_age).state) && id(sgp41_data_age).state > id(sensor_stale_limit).state) ||
          (!isnan(id(ze07_data_age).state) && id(ze07_data_age).state > id(sensor_stale_limit).state) ||
          !id(ze07_connected).state)
        return {"Die Luftqualität ${assessment_location} ist derzeit nicht zuverlässig bewertbar. Sensordaten fehlen."};

      std::string negative_values;
      auto add_value = [&negative_values](const std::string &value) {
        if (!negative_values.empty()) negative_values += "; ";
        negative_values += value;
      };
      int severity = 0;

      if (id(co).state >= id(co_alarm_limit).state) {
        add_value(str_sprintf("CO %.1f ppm", id(co).state));
        severity = 4;
      } else if (id(co).state >= id(co_elevated_limit).state) {
        add_value(str_sprintf("CO %.1f ppm", id(co).state));
        severity = 3;
      }

      if (id(co2).state >= id(co2_critical_limit).state) {
        add_value(str_sprintf("Kohlendioxid %.0f ppm", id(co2).state));
        if (severity < 3) severity = 3;
      } else if (id(co2).state >= id(co2_ventilation_limit).state) {
        add_value(str_sprintf("Kohlendioxid %.0f ppm", id(co2).state));
        if (severity < 2) severity = 2;
      }

      if (id(voc_index).state >= id(voc_high_limit).state) {
        add_value(str_sprintf("VOC Index %.0f", id(voc_index).state));
        if (severity < 3) severity = 3;
      } else if (id(voc_index).state >= id(voc_elevated_limit).state) {
        add_value(str_sprintf("VOC Index %.0f", id(voc_index).state));
        if (severity < 2) severity = 2;
      }

      if (id(nox_index).state >= id(nox_high_limit).state) {
        add_value(str_sprintf("NOx Index %.0f", id(nox_index).state));
        if (severity < 3) severity = 3;
      } else if (id(nox_index).state >= id(nox_elevated_limit).state) {
        add_value(str_sprintf("NOx Index %.0f", id(nox_index).state));
        if (severity < 2) severity = 2;
      }

      if (id(temperature).state < id(temperature_min_limit).state ||
          id(temperature).state > id(temperature_max_limit).state) {
        add_value(str_sprintf("Temperatur %.1f Grad", id(temperature).state));
        if (severity < 1) severity = 1;
      }

      if (id(humidity).state < id(humidity_min_limit).state ||
          id(humidity).state > id(humidity_max_limit).state) {
        add_value(str_sprintf("Feuchte %.0f Prozent", id(humidity).state));
        if (severity < 1) severity = 1;
      }

      if (!isnan(id(condensation_margin).state) &&
          id(condensation_margin).state <= id(condensation_warning_limit).state) {
        add_value(str_sprintf("Kondensationsreserve %.1f Grad", id(condensation_margin).state));
        if (id(condensation_margin).state <= 0.0f) {
          if (severity < 3) severity = 3;
        } else if (severity < 2) {
          severity = 2;
        }
      }

      if (id(possible_exhaust).state) {
        add_value("Abgastrend aktiv");
        severity = 4;
      } else if (id(combustion_suspicious).state) {
        add_value("Verbrennungstrend aktiv");
        if (severity < 3) severity = 3;
      }

      const char *overall_text = "gut";
      if (severity == 1) overall_text = "mäßig";
      else if (severity == 2) overall_text = "auffällig";
      else if (severity == 3) overall_text = "schlecht";
      else if (severity >= 4) overall_text = "kritisch";

      if (negative_values.empty())
        return {"Die Luftqualität ${assessment_location} ist gut."};
      return {str_sprintf("Die Luftqualität ${assessment_location} ist %s. Auffällig: %s.",
                          overall_text, negative_values.c_str())};

  - platform: template
    name: "Sensorzustand"
    icon: mdi:check-network-outline
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      std::string problems;
      auto add_problem = [&problems](const char *problem) {
        if (!problems.empty()) problems += "; ";
        problems += problem;
      };
      if (isnan(id(scd41_data_age).state)) add_problem("SCD41 startet");
      else if (id(scd41_data_age).state > id(sensor_stale_limit).state) add_problem("SCD41 Daten veraltet");
      if (isnan(id(sgp41_data_age).state)) add_problem("SGP41 startet");
      else if (id(sgp41_data_age).state > id(sensor_stale_limit).state) add_problem("SGP41 Daten veraltet");
      if (!id(ze07_connected).state) add_problem("ZE07 nicht verbunden");
      else if (isnan(id(ze07_data_age).state)) add_problem("ZE07 startet");
      else if (id(ze07_data_age).state > id(sensor_stale_limit).state) add_problem("ZE07 Daten veraltet");
      if (id(ze07_service_due).state) add_problem("ZE07 Wartung fällig");
      if (problems.empty()) return {"Alle Sensoren liefern aktuelle Daten."};
      return {"Sensorprüfung: " + problems + "."};

  - platform: debug
    reset_reason:
      name: "Neustartursache"
      entity_category: diagnostic

  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic

button:
  - platform: restart
    name: "Neustart"
    entity_category: diagnostic

  - platform: template
    name: "SCD41 Zwangskalibrierung"
    icon: mdi:tune-vertical
    entity_category: config
    disabled_by_default: true
    on_press:
      - scd4x.perform_forced_calibration:
          id: scd41_component
          value: !lambda return (uint16_t) id(scd41_calibration_reference).state;

  - platform: template
    name: "SCD41 Werkseinstellungen"
    icon: mdi:restore-alert
    entity_category: config
    disabled_by_default: true
    on_press:
      - scd4x.factory_reset: scd41_component

  - platform: template
    name: "ZE07 Betriebsstunden zurücksetzen"
    icon: mdi:timer-refresh-outline
    entity_category: config
    disabled_by_default: true
    on_press:
      - lambda: id(ze07_operating_hours_total) = 0.0f;

interval:
  - interval: 6h
    then:
      - if:
          condition:
            binary_sensor.is_on: ze07_connected
          then:
            - lambda: id(ze07_operating_hours_total) += 6.0f;
