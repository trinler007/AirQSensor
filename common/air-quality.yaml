substitutions:
  # Diagnose-Startwerte, keine normativen oder zertifizierten Alarmgrenzen.
  co_alarm_ppm: "30.0"
  co_elevated_ppm: "5.0"
  co2_ventilation_ppm: "1200.0"
  voc_ventilation_index: "150.0"
  co_rise_ppm_per_min: "2.0"
  voc_rise_per_min: "5.0"
  nox_rise_per_min: "2.0"
  co2_normal_max_ppm: "1200.0"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: ${device_location}
  min_version: 2026.7.0
  project:
    name: trinler.airq_sensor
    version: "0.1.0"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components
    components: [ze07_co]

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: LIGHT
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_ap_password

captive_portal:

i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true
  frequency: 100kHz

uart:
  id: ze07_uart
  rx_pin: GPIO17
  tx_pin: GPIO18
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 256

sensor:
  - platform: scd4x
    id: scd41_component
    address: 0x62
    measurement_mode: low_power_periodic
    update_interval: 30s
    automatic_self_calibration: true
    co2:
      name: "CO₂"
      id: co2
      accuracy_decimals: 0
    temperature:
      name: "Temperatur"
      id: temperature
      accuracy_decimals: 1
    humidity:
      name: "Luftfeuchte"
      id: humidity
      accuracy_decimals: 1

  - platform: sgp4x
    id: sgp41_component
    address: 0x59
    update_interval: 30s
    store_baseline: true
    voc:
      name: "VOC Index"
      id: voc_index
      accuracy_decimals: 0
    nox:
      name: "NOx Index"
      id: nox_index
      accuracy_decimals: 0
    compensation:
      temperature_source: temperature
      humidity_source: humidity

  - platform: ze07_co
    id: ze07_component
    uart_id: ze07_uart
    co:
      name: "CO"
      id: co
      filters:
        - throttle_average: 10s
    full_scale:
      name: "CO Messbereich"
      entity_category: diagnostic
    frame_errors:
      name: "CO UART Framefehler"
      entity_category: diagnostic

  - platform: wifi_signal
    name: "WLAN Signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    entity_category: diagnostic

  # Ein-Minuten-Differenzen als leicht verständliche Trendindikatoren.
  - platform: template
    name: "CO Trend"
    id: co_trend
    unit_of_measurement: "ppm/min"
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      static float previous = NAN;
      const float current = id(co).state;
      if (isnan(current)) return {};
      if (isnan(previous)) { previous = current; return 0.0f; }
      const float delta = current - previous;
      previous = current;
      return delta;

  - platform: template
    name: "VOC Trend"
    id: voc_trend
    unit_of_measurement: "index/min"
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      static float previous = NAN;
      const float current = id(voc_index).state;
      if (isnan(current)) return {};
      if (isnan(previous)) { previous = current; return 0.0f; }
      const float delta = current - previous;
      previous = current;
      return delta;

  - platform: template
    name: "NOx Trend"
    id: nox_trend
    unit_of_measurement: "index/min"
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      static float previous = NAN;
      const float current = id(nox_index).state;
      if (isnan(current)) return {};
      if (isnan(previous)) { previous = current; return 0.0f; }
      const float delta = current - previous;
      previous = current;
      return delta;

binary_sensor:
  - platform: status
    name: "Status"
    entity_category: diagnostic

  - platform: ze07_co
    ze07_co_id: ze07_component
    connected:
      name: "CO Sensor verbunden"
      entity_category: diagnostic

  - platform: template
    name: "Lüften empfohlen"
    device_class: problem
    lambda: |-
      if (isnan(id(co2).state) || isnan(id(voc_index).state) || isnan(id(co).state)) return {};
      return (id(co2).state >= ${co2_ventilation_ppm} ||
              id(voc_index).state >= ${voc_ventilation_index}) &&
             id(co).state < ${co_elevated_ppm};
    filters:
      - delayed_on: 2min
      - delayed_off: 2min

  - platform: template
    name: "Heizung oder Verbrennung auffällig"
    device_class: problem
    lambda: |-
      if (isnan(id(co_trend).state) || isnan(id(voc_trend).state) || isnan(id(co2).state)) return {};
      return id(co_trend).state >= ${co_rise_ppm_per_min} &&
             id(voc_trend).state >= ${voc_rise_per_min} &&
             id(co2).state < ${co2_normal_max_ppm};
    filters:
      - delayed_on: 30s
      - delayed_off: 2min

  - platform: template
    name: "Mögliche Abgase"
    device_class: problem
    lambda: |-
      if (isnan(id(co).state) || isnan(id(co_trend).state) ||
          isnan(id(voc_trend).state) || isnan(id(nox_trend).state)) return {};
      return id(co).state >= ${co_elevated_ppm} &&
             id(co_trend).state >= ${co_rise_ppm_per_min} &&
             id(voc_trend).state >= ${voc_rise_per_min} &&
             id(nox_trend).state >= ${nox_rise_per_min};
    filters:
      - delayed_on: 30s
      - delayed_off: 2min

  - platform: template
    name: "CO Diagnosealarm"
    id: co_diagnostic_alarm
    device_class: carbon_monoxide
    lambda: |-
      if (isnan(id(co).state)) return {};
      return id(co).state >= ${co_alarm_ppm};
    filters:
      - delayed_on: 10s
      - delayed_off: 2min

text_sensor:
  - platform: template
    name: "Luftqualität Bewertung"
    icon: mdi:air-filter
    update_interval: 30s
    lambda: |-
      if (id(co_diagnostic_alarm).state) return {"CO-Diagnosealarm"};
      if (isnan(id(co).state) || isnan(id(co2).state) ||
          isnan(id(voc_index).state) || isnan(id(nox_index).state)) return {"Sensoren starten"};
      if (id(co).state >= ${co_elevated_ppm} &&
          !isnan(id(nox_trend).state) && id(nox_trend).state >= ${nox_rise_per_min} &&
          !isnan(id(voc_trend).state) && id(voc_trend).state >= ${voc_rise_per_min})
        return {"Mögliche Abgase"};
      if (!isnan(id(co_trend).state) && id(co_trend).state >= ${co_rise_ppm_per_min} &&
          !isnan(id(voc_trend).state) && id(voc_trend).state >= ${voc_rise_per_min})
        return {"Verbrennung auffällig"};
      if ((id(co2).state >= ${co2_ventilation_ppm} ||
           id(voc_index).state >= ${voc_ventilation_index}) &&
          id(co).state < ${co_elevated_ppm}) return {"Lüften empfohlen"};
      return {"Unauffällig"};

  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic

button:
  - platform: restart
    name: "Neustart"
    entity_category: diagnostic

