# Optionaler aktiver Buzzer an GPIO7 über eine geeignete Transistorstufe.
# Die RGB-Anzeige nutzt die bereits im Basispaket konfigurierte Board-LED.
switch:
  - platform: gpio
    id: local_buzzer_output
    internal: true
    pin: GPIO7
    restore_mode: ALWAYS_OFF

  - platform: template
    id: local_alarm_enabled
    name: "Lokaler akustischer Alarm"
    icon: mdi:volume-high
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

button:
  - platform: template
    name: "Lokalen Alarm testen"
    icon: mdi:alarm-light-outline
    entity_category: config
    on_press:
      - light.turn_on:
          id: onboard_rgb_led
          red: 100%
          green: 0%
          blue: 0%
          brightness: !lambda return id(rgb_alarm_brightness).state / 100.0f;
      - if:
          condition:
            switch.is_on: local_alarm_enabled
          then:
            - switch.turn_on: local_buzzer_output
      - delay: 2s
      - switch.turn_off: local_buzzer_output
      - light.turn_off: onboard_rgb_led

interval:
  - interval: 2s
    then:
      - if:
          condition:
            and:
              - switch.is_on: local_alarm_enabled
              - or:
                  - binary_sensor.is_on: co_diagnostic_alarm
                  - binary_sensor.is_on: possible_exhaust
          then:
            - switch.turn_on: local_buzzer_output
          else:
            - switch.turn_off: local_buzzer_output
